# prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api_1:8000", "api_2:8000", "api_3:8000"]
    metrics_path: /metrics

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb:27017"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
