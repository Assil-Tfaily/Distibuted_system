apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 3 # This gives you load balancing!
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      containers:
        - name: rag-api
          image: busybox # Lightweight placeholder
          command: ["sleep", "3600"] # Just keep container running
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-service
spec:
  selector:
    app: rag-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
